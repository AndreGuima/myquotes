services:
  # 🐬 MySQL 8.0 #
  db:
    image: mysql:8.0
    container_name: myquotes-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - myquotes-network

  # 🐍 FastAPI Backend #
  backend:
    environment:
      TZ: America/Sao_Paulo
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myquotes-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - myquotes-network

  cron:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myquotes-cron
    restart: always
    command: sh -c "printenv > /etc/environment && cron -f"
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - myquotes-network


  # 🌐 Vite + React Frontend #
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myquotes-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - myquotes-network


volumes:
  mysql_data:

networks:
  myquotes-network:
    driver: bridge
