services:
  # 🐬 MySQL 8.0
  db:
    image: mysql:8.0
    container_name: myquotes-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - myquotes-network

  # 🐍 FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myquotes-backend
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/src/app
      - ./backend/wait-for-db.sh:/app/src/wait-for-db.sh
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
    working_dir: /app
    command: >
      sh -c "/app/src/wait-for-db.sh && uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - myquotes-network

  # 🌐 Vite + React Frontend
  myquotes-web:
    build: ./myquotes-web
    container_name: myquotes-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - myquotes-network

volumes:
  mysql_data:

networks:
  myquotes-network:
    driver: bridge
