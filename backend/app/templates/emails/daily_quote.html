<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Quote of the Day</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f4; padding: 20px 0"
    >
      <tr>
        <td align="center">
          <!-- Container -->
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 8px;
              padding: 24px;
            "
          >
            <!-- Header -->
            <tr>
              <td align="center" style="padding-bottom: 16px">
                <h2 style="margin: 0; color: #333333">📜 Quote of the Day</h2>
              </td>
            </tr>

            <!-- Greeting -->
            {% if username %}
            <tr>
              <td style="padding-bottom: 12px; color: #555555">
                Olá <strong>{{ username }}</strong>,
              </td>
            </tr>
            {% endif %}

            <!-- Quote -->
            <tr>
              <td
                style="
                  padding: 20px;
                  background-color: #fafafa;
                  border-left: 4px solid #4f46e5;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 18px;
                    line-height: 1.5;
                    font-style: italic;
                    color: #222222;
                  "
                >
                  “{{ text }}”
                </p>

                <p
                  style="
                    margin-top: 12px;
                    text-align: right;
                    font-size: 14px;
                    color: #555555;
                  "
                >
                  — {{ author }}
                </p>
              </td>
            </tr>

            <!-- Spacer -->
            <tr>
              <td style="height: 20px"></td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  font-size: 12px;
                  color: #888888;
                  text-align: center;
                  padding-top: 12px;
                "
              >
                Você está recebendo este email porque ativou o envio diário de
                quotes no <strong>MyQuotes</strong>.
                <br />
                <span style="color: #aaaaaa">
                  Você poderá gerenciar suas preferências em ...
                </span>
              </td>
            </tr>
          </table>
          <!-- /Container -->
        </td>
      </tr>
    </table>
  </body>
</html>
